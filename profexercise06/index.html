<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
                content="width=device-width, initial-scale=1.0">
        <title>Personal Data</title>
    </head>
    <body>
        <header>
            <h1>Personal Data</h1>
        </header>
        <main>           
            <form action="thoughts" method="get">
                <div class="form-element">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-element">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age">     
                </div>  
                
                <div class="form-element">
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms">By checking this box, you accept
                        all terms and conditions, and we can sell your
                        information on the web to make great profit.
                    </label>
                </div>

                <div class="form-element">
                    <input type="checkbox" id="shouting" name="shouting">
                    <label for="shouting">Shouting?</label>
                </div>

                <div class="submit-area">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </main>
    </body>
</html>
