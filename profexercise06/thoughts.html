<!DOCTYPE html>
<html lang="en">

    <body>
        <header>
            <h1>Thoughts</h1>

        <main>   
            <script type="module">
                import {greet,MODULE_OATMEAL} from "./js/utils.js";
                const params = new URLSearchParams(window.location.search);
                let fullName = params.get("name");
                let age = params.get("age");
                let height = params.get("height");
                const terms = params.get("terms");
                const isShouting = params.has("shouting");

                // Process full name
                fullName = fullName.trim();
                fullName = fullName || "Guest";
                const spaceIndex = fullName.indexOf(" ");
                if(spaceIndex != -1) {
                    const first = fullName.slice(0,spaceIndex);
                    const last = fullName.slice(spaceIndex+1).trim();
                    fullName = `${first} of House ${last}`;
                }

                console.log(greet(fullName));
                
                // Age calculations                
                console.log("Age before:", age, typeof age);
                age = Number(age);
                console.log("Age after:", age, typeof age);

                const currentYear = new Date().getFullYear();
                let yearOfBirth = currentYear - age;
                let birthString = fullName + " was born in " 
                                    + yearOfBirth + ".";

                let ancientString = "";
                if(age > 200) {
                    ancientString = "  JEEPERS, YOU'RE ANCIENT.";
                }

                let renString = "";
                if(yearOfBirth >= 1300 && yearOfBirth <= 1600) {
                    renString = "  You are born in the Renaissance.";
                }

                // Check height                
                console.log("Height:", height, typeof height);

                // Check terms 
                console.log("terms:", terms);

                let termsString = "";
                if(terms == null) {
                    termsString = "  Aw man, there goes my retirement.";
                }

                // Compile final output
                let finalString = birthString + ancientString + termsString + renString;
                if(isShouting) {
                    finalString = finalString.toUpperCase();
                }
                
                document.getElementById("thoughts").textContent
                 = finalString;

            </script>
