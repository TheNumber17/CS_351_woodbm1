<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thoughts</title> 
        <script src="/js/classic.js"></script>
    </head>
    <body>
        <header>
            <h1>Thoughts</h1>
        </header>
        <main> 
            <script type="module">
                import * as util from "/js/utils.js";
                const params = new URLSearchParams(window.location.search);
                let fullName = params.get("name");
                let age = params.get("age");
                const termsAccepted = params.has("terms");
                const isShouting = params.has("shouting");
                let birthYear = util.calculateBirthYear(Number(age));


                const person = {
                    name: fullName,
                    age: Number(age),
                    yearBirth: birthYear,
                    termsAccepted
                }

                const thoughtsElement = document.getElementById("thoughts");

                const thoughtsView = {
                    person,
                    isShouting,
                
                    buildThoughts(person, shouting){
                        let ancientString = "";
                        if(this.person.age > 200){
                            ancientString = "Wow, you are ancient! ";
                        }

                        // Check terms
                        let termsString = "";
                        if(this.person.termsAccepted){
                            termsString = "Also you smell like old carpet.";
                        }

                        let renString = "";
                        if(util.checkInRenaissance(this.person.yearBirth)){
                            renString = "You were born in the Renaissance period.";
                        }

                        this.person.name = util.processFullName(this.person.name);
                        
                        // Compile final output string
                        let birthString = this.person.name + " was born in " + this.person.yearBirth + "." 
                        + " " + ancientString + renString + " " + termsString;

                        if(this.isShouting){
                            birthString = birthString.toUpperCase();
                        }

                        return birthString;
                    },
                
                    render(){
                        const thoughts = this.buildThoughts();
                        thoughtsElement.textContent = thoughts;
                    },

                    toggleShouting(){
                        this.isShouting = !this.isShouting;
                        this.render();
                    }
                }

                thoughtsView.render();

                const shoutButton = document.getElementById("toggleShouting");
                shoutButton.addEventListener(
                    "click",
                    thoughtsView.toggleShouting.bind(thoughtsView)
                );
            </script>

            <button id="toggleShouting" type="button">Toggle Shouting</button>
            <p id="thoughts"></p>
        </main>
    </body>
</html>
