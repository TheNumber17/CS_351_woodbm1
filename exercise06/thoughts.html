<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thoughts</title> 
        <script src="/js/classic.js"></script>
    </head>
    <body>
        <header>
            <h1>Thoughts</h1>
        </header>
        <main> 
            <script type="module">
                import { greet, MODULE_OATMEAL } from "/js/utils.js";
                const params = new URLSearchParams(window.location.search);
                let fullName = params.get("name");
                fullName = fullName || "Guest";
                console.log(greet(fullName));
                console.log("Module Oatmeal from module: ", MODULE_OATMEAL);

                let age = params.get("age");
                console.log("Age before: ", age, typeof age);
                age = Number(age);
                console.log("Age after: ", age, typeof age);

                let terms = params.get("terms");

                let ancientString = "";
                if(age > 200){
                    ancientString = "Wow, you are ancient! ";
                }

                let termsString = "";
                if(terms == null){
                    termsString = "Also you smell like old carpet.";
                }

                let renString = "";
                

                let height = params.get("height");
                console.log("Height: ", height, typeof height);

                const currentYear = new Date().getFullYear();
                let birthYear = currentYear - age;

                if(birthYear >= 1300 && birthYear <= 1600){
                    renString = "You were born in the Renaissance period.";
                }
                
                let birthString = fullName + " was born in " + birthYear + "." 
                + " " + ancientString + renString;

                document.getElementById("thoughts").textContent = birthString + " " + termsString;
            </script>
            <script type="module">
                //console.log("fullname in internal module: ", fullName);
                console.log("Classic Oatmeal from module: ", CLASSIC_OATMEAL);
            </script>
            <script>
                console.log("Classic Oatmeal from module: ", CLASSIC_OATMEAL);
                //console.log("fullname in classic: ", fullName);
                let thoughtElement = document.getElementById("thoughts");
            </script>

            <p id="thoughts"></p>
            <script>
                console.log("Thoughts before:", thoughtElement);
                thoughtElement = document.getElementById("thoughts");
                console.log("Thoughts after:", thoughtElement);
            </script>
        </main>
    </body>
</html>
