<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
                content="width=device-width, initial-scale=1.0">
        <title>Loremaker</title>
    </head>
    <body>
        <header>
            <h1>Loremaker</h1>
        </header>
        <main>
            <h2>Details</h2>

            <form action="story" method="post">
                <label for="given-name">Given Name:</label>
                <input type="text" id="given-name" name="firstname" 
                required placeholder="E.g. Steven Michael"><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" 
                required placeholder="E.g. 123-456-7890"
                pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob"><br>

                <label for="height">Height:</label>
                <input type="number" id="height" name="height" 
                step="0.01" min="0"><br>


                <label>Place of Birth:</label>

                <input type="radio" id="town" name="birth" value="town">
                <label for="town">Town</label>

                <input type="radio" id="city" name="birth" value="city">
                <label for="city">City</label>

                <input type="radio" id="forest" name="birth" value="forest">
                <label for="forest">Forest</label>

                <button type="submit">Submit</button>
            </form>
        </main>
    </body>
</html>
